# 1 = enable MGLRU, 0 = disable
ENABLE=1
# working-set protection in ms (0 = off, safest)
MIN_TTL_MS=0
# 1 = apply RAM tuning, 0 = skip
RAM_TUNE=1
# vm.swappiness (0-200), higher = swap to zram more
SWAPPINESS=100
# vm.page-cluster (0-3), 0 = no swap read-ahead (good for zram)
PAGE_CLUSTER=0
# vm.vfs_cache_pressure (default 100), higher = free dentry/inode cache sooner
VFS_CACHE_PRESSURE=120
