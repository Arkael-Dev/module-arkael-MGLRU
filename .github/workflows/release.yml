name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version
        run: |
          VER=$(grep '^version=' module.prop | cut -d= -f2)
          CODE=$(grep '^versionCode=' module.prop | cut -d= -f2)
          [ "$VER" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match module.prop version $VER"; exit 1; }
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "CODE=$CODE" >> "$GITHUB_ENV"

      - name: Check scripts
        run: |
          for f in service.sh customize.sh build.sh META-INF/com/google/android/update-binary; do sh -n "$f"; done

      - name: Build zip
        run: |
          sh build.sh
          zip -T "dist/Arkael-Mglru-$VER.zip"

      - name: Release notes
        run: |
          awk -v h="## $VER" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::No '## $VER' section in CHANGELOG.md"; exit 1; }

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/Arkael-Mglru-$VER.zip" --title "Arkael MGLRU $VER" --notes-file notes.md

      - name: Update update.json
        env:
          REPO: ${{ github.repository }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          printf '{\n  "version": "%s",\n  "versionCode": %s,\n  "zipUrl": "https://github.com/%s/releases/download/%s/Arkael-Mglru-%s.zip",\n  "changelog": "https://raw.githubusercontent.com/%s/main/CHANGELOG.md"\n}\n' "$VER" "$CODE" "$REPO" "$VER" "$VER" "$REPO" > update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --cached --quiet; then echo "update.json sudah terbaru"; else git commit -m "Update update.json for $VER" && git push origin main; fi
